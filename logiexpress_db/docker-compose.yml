services:
  mysql_db:
    build:
      context: .
      dockerfile: dockerfile
    container_name: logiexpress_local_db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: logiexpress_db
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
